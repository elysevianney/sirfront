<div class="min-h-screen bg-gray-100 p-8">
  <div class="max-w-2xl mx-auto bg-white shadow-lg rounded-2xl p-10">
    @if (currentUser()) {
      <h1 class="mb-4 flex items-center gap-3 text-4xl font-bold text-gray-800">
        <app-icon name="user" />
        <span>Bonjour {{ currentUser()?.email }}</span>
      </h1>
      <p class="text-gray-600 text-lg mb-8">
        Bienvenue sur votre dashboard
      </p>
      <button (click)="logout()"
              class="inline-flex items-center gap-2 px-6 py-2 bg-red-600 text-white rounded-xl hover:bg-red-700 transition">
        <app-icon name="log-out" />
        Se déconnecter
      </button>
    } @else {
      <p class="text-gray-600">Chargement...</p>
    }
  </div>
</div>
