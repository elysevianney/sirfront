<div class="space-y-6">
  <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <p class="text-sm uppercase tracking-[0.28em] text-sky-500">Ajouter un magazine</p>
      <h1 class="mt-2 text-3xl font-semibold text-slate-950">Créer un nouvel élément Magazine</h1>
    </div>
    <a
      routerLink="/elements"
      class="inline-flex items-center justify-center rounded-full border border-slate-300 bg-white px-5 py-3 text-sm font-semibold text-slate-900 transition hover:bg-slate-50"
    >
      Retour à la liste
    </a>
  </div>

  <form (ngSubmit)="submit()" class="space-y-6 rounded-3xl bg-white p-6 shadow-sm">
    <div class="grid gap-5 sm:grid-cols-2">
      <label class="space-y-2">
        <span class="text-sm font-medium text-slate-700">Titre</span>
        <input
          type="text"
          [value]="title()"
          (input)="title.set($any($event.target).value)"
          class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100"
          required
        />
      </label>
      <label class="space-y-2">
        <span class="text-sm font-medium text-slate-700">Date de publication</span>
        <input
          type="date"
          [value]="datePublication()"
          (input)="datePublication.set($any($event.target).value)"
          class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none focus:border-sky-500 focus:ring-2 focus:ring-sky-100"
          required
        />
      </label>
    </div>

    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
      <div>
        <p class="text-sm text-slate-500">Média</p>
        <p class="text-lg font-semibold text-slate-900">MAG</p>
      </div>
      <button
        type="submit"
        [disabled]="saving()"
        class="inline-flex items-center justify-center rounded-full bg-sky-600 px-6 py-3 text-sm font-semibold text-white transition hover:bg-sky-700 disabled:cursor-not-allowed disabled:opacity-50"
      >
        {{ saving() ? 'Enregistrement...' : 'Créer le magazine' }}
      </button>
    </div>

    <div *ngIf="error()" class="rounded-3xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">
      {{ error() }}
    </div>
  </form>
</div>
