<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
  <div class="w-full max-w-md bg-white shadow-lg rounded-2xl p-8">
    <h1 class="text-2xl font-bold text-center text-gray-800 mb-6">
      S'inscrire
    </h1>

    @if (errorMessage()) {
      <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg">
        {{ errorMessage() }}
      </div>
    }

    <form class="space-y-5" (ngSubmit)="onSubmit($event)">
      <div>
        <label for="nom" class="block text-sm font-medium text-gray-700 mb-1">
          Nom
        </label>
        <input [formField]="form.nom" type="text" autocomplete="family-name"
                   class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"
                   placeholder="Dupont" />
      </div>

      <div>
        <label for="prenom" class="block text-sm font-medium text-gray-700 mb-1">
          Prénom
        </label>
        <input [formField]="form.prenom" type="text" autocomplete="given-name"
                   class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"
                   placeholder="Jean" />
      </div>

      <div>
        <label for="adresse" class="block text-sm font-medium text-gray-700 mb-1">
          Adresse
        </label>
        <input [formField]="form.adresse" type="text" autocomplete="street-address"
                   class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"
                   placeholder="123 Rue de la Paix, 75000 Paris" />
      </div>

      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
          Email
        </label>
        <input [formField]="form.email" type="email" autocomplete="email"
                   class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"
                   placeholder="exemple@email.com" />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
          Mot de passe
        </label>
        <input [formField]="form.password" type="password" autocomplete="new-password"
                   class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500"
                   placeholder="••••••••" />
      </div>

      <button type="submit" [disabled]="!form().valid() || loading()"
                  class="w-full bg-blue-600 text-white py-2 rounded-xl hover:bg-blue-700 transition disabled:bg-gray-400 disabled:cursor-not-allowed">
            {{ loading() ? 'Inscription en cours...' : 'S\'inscrire' }}
          </button>
    </form>
  </div>
</div>
